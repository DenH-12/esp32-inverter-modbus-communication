views:
  - type: sections
    sections:
      - type: grid
        cards:
          - type: vertical-stack
            cards:
              - type: gauge
                entity: sensor.battery_charge_percent
                name: Заряд АКБ
                min: 0
                max: 100
                severity:
                  green: 70
                  yellow: 30
                  red: 0
                needle: false
              - type: glance
                entities:
                  - entity: sensor.esp32_solar_8e6d00_battery_voltage
                    name: Напруга
                    icon: mdi:battery
                  - entity: sensor.esp32_solar_8e6d00_output_power
                    name: Навантаження
                    icon: mdi:home-lightning-bolt
                    show_last_changed: false
                    show_state: true
                  - entity: sensor.esp32_solar_8e6d00_pv_power
                    name: Сонце
                    icon: mdi:solar-power
                    show_state: true
              - type: glance
                entities:
                  - entity: sensor.esp32_solar_8e6d00_grid_voltage
                    name: Мережа
                    icon: mdi:transmission-tower
                    card_mod:
                      style: |
                        state-badge {
                          color: {% if states('sensor.esp32_solar_8e6d00_grid_voltage') | float < 150 %} red {% endif %};
                        }
                  - entity: sensor.esp32_solar_8e6d00_battery_current
                    name: Струм АКБ
                    icon: mdi:battery
                    card_mod:
                      style: |
                        state-badge {
                          color: {% if states('sensor.esp32_solar_8e6d00_battery_current') | float > 110 %} red {% endif %};
                        }
                  - entity: sensor.esp32_solar_8e6d00_inverter_temperature
                    name: Температура
                    card_mod:
                      style: |
                        state-badge {
                          color: {% if states('sensor.esp32_solar_8e6d00_inverter_temperature') | float > 50 %} red {% endif %};
                        }
              - type: glance
                entities:
                  - entity: sensor.esp32_solar_8e6d00_grid_power
                    icon: mdi:transmission-tower-export
                    name: Мережа Вт
                  - entity: sensor.esp32_solar_8e6d00_battery_power
                    name: Потужність АКБ
                    icon: mdi:battery
                  - entity: sensor.esp32_solar_8e6d00_output_voltage
                    icon: mdi:flash-triangle
                    name: Вихідна напруга
              - type: horizontal-stack
                cards:
                  - type: gauge
                    entity: sensor.esp32_solar_8e6d00_load_percent
                    name: Навантаження
                    needle: true
                    severity:
                      green: 0
                      yellow: 50
                      red: 80
                  - type: gauge
                    entity: sensor.esp32_solar_8e6d00_pv_voltage
                    needle: true
                    severity:
                      green: 250
                      yellow: 230
                      red: 0
                    name: Сонце ☀️
                    min: 220
                    max: 270
          - type: entities
            entities:
              - entity: sensor.pv_energy_today
                icon: mdi:lightning-bolt
              - entity: sensor.pv_energy_this_month
                icon: mdi:lightning-bolt
            state_color: false
            show_header_toggle: false
      - type: grid
        cards:
          - type: heading
            heading_style: title
            heading: Settings
            icon: mdi:cog
            grid_options:
              columns: 18
              rows: auto
          - type: vertical-stack
            cards:
              - type: entity
                entity: sensor.esp32_solar_8e6d00_uptime
              - type: horizontal-stack
                cards:
                  - type: entity
                    entity: sensor.esp32_solar_8e6d00_status
                  - type: button
                    entity: button.inverter_settings
                    name: Refresh
                    tap_action:
                      action: toggle
                    color: green
                    icon_height: 30px
              - type: horizontal-stack
                cards:
                  - type: entity
                    entity: sensor.esp32_solar_8e6d00_free_heap
                  - type: entity
                    entity: sensor.esp32_solar_8e6d00_minimum_heap_free
                  - type: entity
                    entity: sensor.esp32_solar_8e6d00_last_reset_reason
                    secondary_info: state
              - type: entities
                entities:
                  - entity: number.esp32_solar_8e6d00_battery_bulk_voltage
                    name: Bulk Voltage
                    secondary_info: state
                    icon: mdi:battery
                  - entity: number.esp32_solar_8e6d00_battery_float_voltage
                    name: Float Voltage
                    secondary_info: state
                    icon: mdi:battery
                  - entity: number.esp32_solar_8e6d00_battery_recovery_voltage
                    name: Recovery Voltage
                    secondary_info: state
                    icon: mdi:battery-charging
                  - entity: number.esp32_solar_8e6d00_battery_protection_voltage
                    name: Protection Voltage
                    secondary_info: state
                    icon: mdi:battery-alert
                  - entity: number.esp32_solar_8e6d00_battery_cutoff_voltage
                    name: Cutoff Voltage
                    secondary_info: state
                    icon: mdi:battery-alert
                  - entity: number.esp32_solar_8e6d00_battery_cv_float_time
                    name: CV/Float Time
                    secondary_info: state
                    icon: mdi:timer
                  - entity: number.esp32_solar_8e6d00_battery_max_charge_current
                    name: Max. charge current
                    secondary_info: state
                    icon: mdi:current-ac
                  - entity: number.esp32_solar_8e6d00_battery_max_ac_charge_current
                    name: Max. AC charge current
                    secondary_info: state
                    icon: mdi:current-ac
                  - entity: >-
                      number.esp32_solar_8e6d00_battery_equalization_charge_voltage
                    name: Equalization Charge Voltage
                    secondary_info: state
                    icon: mdi:battery
                  - entity: number.esp32_solar_8e6d00_battery_equalization_charge_time
                    name: Equalization Charge Time
                    secondary_info: state
                    icon: mdi:timer
                  - entity: number.esp32_solar_8e6d00_battery_equalization_timeout
                    name: Equalization Timeout
                    secondary_info: state
                    icon: mdi:timer-off
                  - entity: number.esp32_solar_8e6d00_battery_equalization_interval
                    name: Equalization Interval
                    secondary_info: state
                    icon: mdi:timer-sand
                  - entity: >-
                      number.esp32_solar_8e6d00_battery_recovery_state_of_charattery
                    name: Recovery SOC
                    secondary_info: state
                    icon: mdi:battery-charging
                  - entity: >-
                      number.esp32_solar_8e6d00_battery_protection_state_of_charattery
                    name: Protection SOC
                    secondary_info: state
                    icon: mdi:battery-alert
                  - entity: >-
                      number.esp32_solar_8e6d00_battery_cutoff_state_of_charattery
                    name: Cutoff SOC
                    secondary_info: state
                    icon: mdi:battery-alert
            grid_options:
              columns: 12
              rows: auto
      - type: grid
        cards:
          - type: heading
            heading: New section
          - type: vertical-stack
            cards:
              - type: entities
                entities:
                  - entity: select.esp32_solar_8e6d00_output_priority
                    name: Output Priority
                    icon: mdi:format-list-bulleted
                  - entity: select.esp32_solar_8e6d00_input_voltage_range
                    name: Input Voltage Range
                    icon: mdi:power-plug
                  - entity: select.esp32_solar_8e6d00_buzzer_mode
                    name: Buzzer Mode
                    icon: mdi:volume-high
                  - entity: select.esp32_solar_8e6d00_beep_source_interrupt
                    name: Beep Source Interrupt
                    icon: mdi:volume-high
                  - entity: select.esp32_solar_8e6d00_backlight
                    name: Backlight
                    icon: mdi:lightbulb
                  - entity: select.esp32_solar_8e6d00_return_default_display
                    name: Return Default Display
                    icon: mdi:home-automation
                  - entity: select.esp32_solar_8e6d00_power_save_mode
                    name: Power Save Mode
                    icon: mdi:power-sleep
                  - entity: select.esp32_solar_8e6d00_overload_restart
                    name: Overload Restart
                    icon: mdi:restart
                  - entity: select.esp32_solar_8e6d00_overtemperature_restart
                    name: Overtemp Restart
                    icon: mdi:restart
                  - entity: select.esp32_solar_8e6d00_overload_bypass
                    name: Overload Bypass
                    icon: mdi:restart
                  - entity: select.esp32_solar_8e6d00_output_voltage
                    name: Output Voltage
                    icon: mdi:flash
                  - entity: select.esp32_solar_8e6d00_output_frequency
                    name: Output Frequency
                    icon: mdi:flash
                  - entity: select.esp32_solar_8e6d00_battery_type
                    name: Battery Type
                    icon: mdi:battery
                  - entity: select.esp32_solar_8e6d00_battery_charge_priority
                    name: Battery Charge Priority
                    icon: mdi:battery-charging
              - type: button
                entity: button.system_reset
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.system_reset
                  confirmation:
                    text: Reset System?
                color: green
                icon_height: 30px
  - type: masonry
    path: ""
    cards:
      - type: custom:power-flow-card-plus
        title: Моніторинг Інвертора
        entities:
          solar:
            entity: sensor.esp32_solar_8e6d00_pv_power
            display_zero_state: true
          battery:
            entity: sensor.esp32_solar_8e6d00_battery_power
            state_of_charge: sensor.battery_charge_percent
          grid:
            entity: sensor.esp32_solar_8e6d00_grid_power
          home:
            entity: sensor.esp32_solar_8e6d00_output_power
        clickable_entities: true
        display_zero_lines: true
      - type: grid
        columns: 2
        square: false
        cards:
          - type: entities
            title: ☀️ Сонячні панелі (PV)
            entities:
              - entity: sensor.esp32_solar_8e6d00_pv_power
                name: Потужність
              - entity: sensor.esp32_solar_8e6d00_pv_voltage
                name: Напруга
              - entity: sensor.esp32_solar_8e6d00_pv_current
                name: Струм
          - type: entities
            title: 🔋 Акумулятор
            entities:
              - entity: sensor.esp32_solar_8e6d00_battery_power
                name: Потужність
              - entity: sensor.esp32_solar_8e6d00_battery_voltage
                name: Напруга
              - entity: sensor.esp32_solar_8e6d00_battery_current
                name: Струм
          - type: entities
            title: 🔌 Мережа (Grid)
            entities:
              - entity: sensor.esp32_solar_8e6d00_grid_power
                name: Потужність
              - entity: sensor.esp32_solar_8e6d00_grid_voltage
                name: Напруга
              - entity: sensor.esp32_solar_8e6d00_grid_frequency
                name: Частота
          - type: entities
            title: 🏠 Вихід / Навантаження
            entities:
              - entity: sensor.esp32_solar_8e6d00_output_power
                name: Потужність (W)
              - entity: sensor.esp32_solar_8e6d00_output_va
                name: Потужність (VA)
              - entity: sensor.esp32_solar_8e6d00_output_voltage
                name: Напруга
              - entity: sensor.esp32_solar_8e6d00_output_frequency
                name: Частота
              - entity: sensor.esp32_solar_8e6d00_load_percent
                name: Завантаження %
      - type: entities
        title: ⚙️ Режими роботи
        entities:
          - entity: select.esp32_solar_8e6d00_output_priority
            name: Output Priority
          - entity: select.esp32_solar_8e6d00_battery_charge_priority
            name: Battery Charge Priority
          - entity: select.esp32_solar_8e6d00_battery_type
            name: Battery Type
          - entity: select.esp32_solar_8e6d00_input_voltage_range
            name: Input Voltage Range
          - entity: select.esp32_solar_8e6d00_power_save_mode
            name: Power Save Mode
          - entity: select.esp32_solar_8e6d00_backlight
            name: Backlight
      - type: entities
        title: 🔧 Тонкі налаштування АКБ та систем
        entities:
          - type: custom:fold-entity-row
            head:
              type: section
              label: Напруги та струми АКБ
            entities:
              - entity: number.esp32_solar_8e6d00_battery_max_charge_current
                name: Batt Max Chg Current
              - entity: number.esp32_solar_8e6d00_battery_max_ac_charge_current
                name: Batt Max AC Chg Curr
              - entity: number.esp32_solar_8e6d00_battery_bulk_voltage
                name: Batt Bulk Volts
              - entity: number.esp32_solar_8e6d00_battery_float_voltage
                name: Batt Float Volts
              - entity: number.esp32_solar_8e6d00_battery_cutoff_voltage
                name: Batt Cutoff Volts
              - entity: number.esp32_solar_8e6d00_battery_cutoff_state_of_charattery
                name: Batt Cutoff SOC
              - entity: number.esp32_solar_8e6d00_battery_dc_protection_voltage
                name: Batt DC Protect Volts
              - entity: number.esp32_solar_8e6d00_battery_protection_voltage
                name: Batt Protect Volts
              - entity: >-
                  number.esp32_solar_8e6d00_battery_protection_state_of_charattery
                name: Batt Protect SOC
              - entity: number.esp32_solar_8e6d00_battery_recovery_voltage
                name: Batt Recovery Volts
              - entity: number.esp32_solar_8e6d00_battery_recovery_state_of_charattery
                name: Batt Recovery SOC
          - type: custom:fold-entity-row
            head:
              type: section
              label: Еквалізація (Equalization)
            entities:
              - entity: select.esp32_solar_8e6d00_battery_equalization_mode
                name: Equalization Mode
              - entity: number.esp32_solar_8e6d00_battery_equalization_charge_voltage
                name: Batt Eq Chg Volts
              - entity: number.esp32_solar_8e6d00_battery_equalization_charge_time
                name: Batt Eq Chg Time
              - entity: number.esp32_solar_8e6d00_battery_equalization_timeout
                name: Batt Eq Timeout
              - entity: number.esp32_solar_8e6d00_battery_equalization_interval
                name: Batt Eq Interval
              - entity: number.esp32_solar_8e6d00_battery_cv_float_time
                name: Batt CV Float Time
          - type: custom:fold-entity-row
            head:
              type: section
              label: Системні налаштування та захисти
            entities:
              - entity: select.esp32_solar_8e6d00_buzzer_mode
                name: Buzzer Mode
              - entity: select.esp32_solar_8e6d00_beep_source_interrupt
                name: Beep Source Interrupt
              - entity: select.esp32_solar_8e6d00_overload_bypass
                name: Overload Bypass
              - entity: select.esp32_solar_8e6d00_overload_restart
                name: Overload Restart
              - entity: select.esp32_solar_8e6d00_overtemperature_restart
                name: Overtemperature Restart
              - entity: select.esp32_solar_8e6d00_output_voltage
                name: Output Voltage
              - entity: select.esp32_solar_8e6d00_output_frequency
                name: Output Frequency
              - entity: select.esp32_solar_8e6d00_return_default_display
                name: Return Default Display
              - entity: sensor.esp32_solar_8e6d00_inverter_temperature
                name: Inv Temp
              - entity: sensor.esp32_solar_8e6d00_dc_temp
                name: DC Temp
